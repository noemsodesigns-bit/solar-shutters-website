name: Deploy to one.com

# Uploads the site to Koen's one.com hosting over SFTP (encrypted).
#
# TARGET FOLDER: set by the repository variable DEPLOY_DIR.
#   Not set  -> /webroots/www/nieuw/   (hidden test folder — the live site is untouched)
#   Set to /webroots/www/               -> the live site
#
# Leave it unset until Step 5 of the Go-Live Runbook. Changing that one variable
# is the whole go-live switch; this file does not need editing.
#
# Run with "dry_run" ticked to connect and list the server without uploading
# anything. Use that first, to confirm the folder layout.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Connect and list only — upload nothing'
        type: boolean
        default: false
      archive_old:
        description: 'Step 5: move the 2006 site into old-site/ (nothing is deleted)'
        type: boolean
        default: false

concurrency:
  group: onecom-deploy       # never let two uploads overlap
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Look at the server without changing it
        if: inputs.dry_run
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -c "set sftp:auto-confirm yes; \
            open -u \"$USER\",\"$PASS\" sftp://$HOST:22; \
            cls -l /webroots/www/"

      # Step 5, part one. Moves the 2006 FrontPage site out of the way into
      # old-site/. Nothing is deleted, so it can all be moved back.
      - name: Archive the old site
        if: inputs.archive_old
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          OLD="_vti_bin _vti_cnf _vti_log _vti_pvt _vti_txt files myalbum \
               .htaccess _vti_inf.html contact.html default.htm default.html \
               error.html fuzzybird1.mp3 index.htm index.html information.html \
               myalbum.html myalbum.swf myalbum.xml noscript.html postinfo.html \
               product.html soundrangers_rollover02.mp3"
          CMDS="set sftp:auto-confirm yes; open -u \"$USER\",\"$PASS\" sftp://$HOST:22; mkdir -p /webroots/www/old-site;"
          for f in $OLD; do
            CMDS="$CMDS mv /webroots/www/$f /webroots/www/old-site/$f;"
          done
          CMDS="$CMDS cls -l /webroots/www/"
          lftp -c "$CMDS" || true
          echo "--- old site archived (errors above are files that were already moved) ---"

      - name: Upload the site
        if: ${{ !inputs.dry_run && !inputs.archive_old }}
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          DEST: ${{ vars.DEPLOY_DIR || '/webroots/www/nieuw/' }}
        run: |
          lftp -c "set sftp:auto-confirm yes; \
            open -u \"$USER\",\"$PASS\" sftp://$HOST:22; \
            mkdir -p \"$DEST\"; \
            mirror --reverse --only-newer --parallel=4 \
              --exclude-glob .git*/ \
              --exclude-glob .git* \
              --exclude-glob .vercel/ \
              --exclude-glob _removed/ \
              --exclude-glob node_modules/ \
              --exclude-glob *.bak \
              --exclude-glob README.md \
              --exclude-glob .vercelignore \
              --exclude-glob .github/ \
              . \"$DEST\""
          echo "Uploaded to $DEST"
